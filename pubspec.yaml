name: sudoku
description: "A Sudoku Game made with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  logger: ^2.7.0
  path: ^1.9.1
  rxdart: ^0.28.0
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_commons: ^0.11.1
  camera: ^0.12.0+1
  camera_windows: ^0.2.6+4
  path_provider: ^2.1.5
  markdown_widget: ^2.3.2+8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/help.md
